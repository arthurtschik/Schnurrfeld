version: 2
updates:
  # Gradle dependencies and the Gradle wrapper: weekly pull requests for new (security) versions
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # the actions used by the website workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
